  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

